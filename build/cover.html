<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Cover</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Inter:wght@400;500;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1600px;
    height: 2400px;
    background: linear-gradient(135deg, #1a0a00 0%, #4a1a00 35%, #c63b00 75%, #ff6b1a 100%);
    color: #fff;
    font-family: 'Inter', -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 180px 140px;
    position: relative;
    overflow: hidden;
  }
  .glow {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 1400px;
    height: 1400px;
    background: radial-gradient(circle, rgba(255,140,40,0.25) 0%, transparent 60%);
    pointer-events: none;
  }
  .top-mark {
    font-size: 32px;
    letter-spacing: 8px;
    font-weight: 500;
    text-transform: uppercase;
    color: rgba(255,255,255,0.65);
    z-index: 1;
  }
  .center {
    z-index: 1;
    text-align: left;
  }
  .title {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 280px;
    line-height: 0.9;
    letter-spacing: -4px;
    color: #fff;
    text-shadow: 0 8px 60px rgba(0,0,0,0.4);
  }
  .subtitle {
    font-size: 56px;
    font-weight: 400;
    line-height: 1.2;
    margin-top: 60px;
    color: rgba(255,255,255,0.92);
    max-width: 1100px;
  }
  .accent-bar {
    width: 240px;
    height: 8px;
    background: #fff;
    margin-top: 80px;
  }
  .bottom {
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .author {
    font-size: 64px;
    font-weight: 700;
    color: #fff;
  }
  .meta {
    font-size: 36px;
    font-weight: 400;
    color: rgba(255,255,255,0.7);
    letter-spacing: 4px;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="top-mark">Manual de Campo</div>
  <div class="center">
    <div class="title">IGNIÇÃO</div>
    <div class="subtitle">do empreendedor brasileiro</div>
    <div class="accent-bar"></div>
  </div>
  <div class="bottom">
    <div class="author">João Prado</div>
    <div class="meta">2026 · LIVING DOCUMENT</div>
  </div>
</body>
</html>
